name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Approve and Auto-Merge PRs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Batch processing all open Dependabot PRs..."
            # Get list of open PR numbers from dependabot
            prs=$(gh pr list --app dependabot --state open --json number -q '.[].number')
            if [ -z "$prs" ]; then
              prs=$(gh pr list --author "app/dependabot" --state open --json number -q '.[].number')
            fi
            if [ -z "$prs" ]; then
              prs=$(gh pr list --state open --json number,author -q '.[] | select(.author.login | contains("dependabot")) | .number')
            fi

            for pr in $prs; do
              echo "Reviewing and approving PR #$pr..."
              gh pr review "$pr" --approve || true
              echo "Enabling auto-merge on PR #$pr..."
              gh pr merge "$pr" --auto --squash || gh pr merge "$pr" --squash || true
            done
          else
            echo "Processing single PR: ${{ github.event.pull_request.html_url }}"
            gh pr review "${{ github.event.pull_request.html_url }}" --approve
            gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash || gh pr merge "${{ github.event.pull_request.html_url }}" --squash || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
