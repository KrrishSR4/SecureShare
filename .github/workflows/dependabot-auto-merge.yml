name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Approve and Auto-Merge PRs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Batch processing all open Dependabot PRs for repo: $GH_REPO..."
            # Get list of open PR numbers from dependabot
            prs=$(gh pr list --state open --json number,author -q '.[] | select(.author.login | contains("dependabot")) | .number')
            
            if [ -z "$prs" ]; then
              echo "No open Dependabot PRs found."
              exit 0
            fi

            echo "Found open Dependabot PRs: $prs"

            for pr in $prs; do
              echo "Processing PR #$pr..."
              # Approve the PR
              gh pr review "$pr" --approve || echo "Could not approve PR #$pr (might already be approved)"
              
              # Try auto-merge with squash, or direct squash merge if eligible
              gh pr merge "$pr" --auto --squash || gh pr merge "$pr" --squash || echo "PR #$pr cannot be merged right now (checks might still be running or failing)"
            done
          else
            echo "Processing single PR: ${{ github.event.pull_request.html_url }}"
            gh pr review "${{ github.event.pull_request.number }}" --approve || true
            gh pr merge "${{ github.event.pull_request.number }}" --auto --squash || gh pr merge "${{ github.event.pull_request.number }}" --squash || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
