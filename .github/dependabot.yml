version: 2
updates:
  # Monitor npm dependencies for workspaces at the root level
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      # Group development dependencies for minor and patch updates
      dev-dependencies-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Group production dependencies for minor and patch updates
      prod-dependencies-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # Monitor GitHub Actions dependencies in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5

  # Monitor Docker dependencies in the root (for docker-compose.yml)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3

  # Monitor Docker dependencies in the client workspace
  - package-ecosystem: "docker"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3

  # Monitor Docker dependencies in the server workspace
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
